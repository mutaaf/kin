<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0B0D12" />
    <meta name="description" content="MyKin: a tiny living creature under your real sky that can hop from your screen onto a friend's." />
    <title>MyKin</title>
  </head>
  <body>
    <div id="app">
      <div id="stage" aria-label="Your KIN's home. Tap to say hi, stroke to pet." role="img"></div>
      <div id="hud">
        <header class="top">
          <button class="who" id="who" type="button" aria-label="Your KIN: open the identity card">
            <span class="brand">MyKin</span><span class="name" id="name"></span><span class="temper" id="temper"></span>
          </button>
          <div class="status-line"><span class="sky-line" id="skyline" aria-live="off"></span><span class="clock" id="clock"></span></div>
        </header>
        <!-- Speech and thought bubbles (src/ui/speech.ts, the persona track) mount here. -->
        <div class="speech-layer" id="speech-layer" aria-live="polite"></div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="hint" id="hint"></div>
        <aside class="prompt" id="prompt" hidden></aside>
        <aside class="postcard" id="postcard" hidden></aside>
        <!-- The MyKin shell (src/ui/shell): action bar, identity card, panels, habitats. -->
        <div id="shell"></div>
        <section class="sheet" id="sheet" hidden role="dialog" aria-modal="false"></section>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <pre class="debug" id="debug" hidden></pre>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
