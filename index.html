<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0B0D12" />
    <meta name="description" content="KIN — a tiny living creature that can hop from your screen onto a friend's." />
    <title>KIN</title>
  </head>
  <body>
    <div id="app">
      <div id="stage" aria-label="Your KIN's home. Tap to say hi, stroke to pet." role="img"></div>
      <div id="hud">
        <header class="top">
          <div class="who"><span class="name" id="name"></span><span class="temper" id="temper"></span></div>
          <div class="sky-line" id="skyline" aria-live="off"></div>
        </header>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="hint" id="hint"></div>
        <aside class="prompt" id="prompt" hidden></aside>
        <aside class="postcard" id="postcard" hidden></aside>
        <nav class="rail" id="rail" aria-label="Actions">
          <button data-sheet="gather" aria-label="Gather: visit a nearby KIN">
            <svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.2"/><circle cx="16.5" cy="12" r="3.2"/><path d="M11.4 12h1.8" /></svg><span>Gather</span>
          </button>
          <button data-sheet="memories" aria-label="Memory book">
            <svg viewBox="0 0 24 24"><path d="M5 5.5h9.5a3 3 0 0 1 3 3V19H8a3 3 0 0 1-3-3z"/><path d="M8.5 9.5h5.5M8.5 12.5h4"/></svg><span>Memories</span>
          </button>
          <button data-sheet="settings" aria-label="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><path d="M12 3.8v2.4M12 17.8v2.4M3.8 12h2.4M17.8 12h2.4M6.2 6.2l1.7 1.7M16.1 16.1l1.7 1.7M6.2 17.8l1.7-1.7M16.1 7.9l1.7-1.7"/></svg><span>Settings</span>
          </button>
        </nav>
        <section class="sheet" id="sheet" hidden role="dialog" aria-modal="false"></section>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <pre class="debug" id="debug" hidden></pre>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
